<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
  <title>DubSync</title>
</head>
<body>
  <div class="header">
    <div class="icon-container">
      <img src="../icons/icon-48.png" alt="Icon" width="24" height="24">
    </div>
    <h1>DubSync</h1>
  </div>
  
  <div class="main-content">
    <div id="status-container" class="status-container idle">
      <div id="status-icon" class="status-icon"></div>
      <div id="status-text" class="status-text">Ready to dub</div>
      <div id="error-message" class="error-message" style="display: none;"></div>
    </div>
    
    <button id="action-btn" class="primary-btn">Dub this video</button>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
